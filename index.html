<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="theme-color" content="#000000">
		<title>Five Nights Fi ElView</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	height: 100%;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-user-select: none;
	user-select: none;
}

#canvas {
	display: block;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: fixed;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 2;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice, #status-start, #status-line {
	display: none;
}

#status-line {
	position: fixed;
	bottom: 22%;
	left: 0;
	right: 0;
	margin: 0 1.5rem;
	color: #b9b9b9;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.8rem;
	line-height: 1.4;
	text-align: center;
	pointer-events: none;
	z-index: 1;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#status-start {
	-webkit-appearance: none;
	appearance: none;
	margin: 1.5rem 0 0;
	padding: 1.1rem 2.4rem;
	border: 1px solid #9b3943;
	border-radius: 0.6rem;
	background-color: #5b3943;
	color: #fff;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 1.1rem;
	letter-spacing: 0.12em;
	text-transform: uppercase;
	cursor: pointer;
	z-index: 2;
}

#status-start:active {
	background-color: #7a4b58;
}

#status-hint {
	position: fixed;
	bottom: 18%;
	left: 0;
	right: 0;
	color: #8d8d8d;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.72rem;
	line-height: 1.4;
	margin: 0 2rem;
	text-align: center;
	display: none;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<button id="status-start" type="button">Tap to play</button>
			<div id="status-hint"></div>
			<div id="status-notice"></div>
		</div>
		<div id="status-line"></div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":54268940,"index.wasm":39358703},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusStart = document.getElementById('status-start');
	const statusHint = document.getElementById('status-hint');
	const statusLine = document.getElementById('status-line');

	let initializing = true;
	let statusMode = '';
	let started = false;
	let startedAt = 0;
	let loadedBytes = 0;
	let pckLoaded = 0;
	let wasmLoaded = 0;
	let packFromDisk = false;
	let phase = 'Starting engine…';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			statusLine.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusStart.style.display = mode === 'ready' ? 'block' : 'none';
		statusHint.style.display = mode === 'ready' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusLine(text) {
		statusLine.textContent = text;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		statusStart.style.display = 'none';
		statusHint.style.display = 'none';
		statusProgress.style.display = 'none';
		setStatusMode('notice');
		initializing = false;
	}

	const sharedBytes = (GODOT_CONFIG['fileSizes'] || {})['index.wasm'] || 0;
	const pckBytes = (GODOT_CONFIG['fileSizes'] || {})['index.pck'] || 0;
	const totalBytes = sharedBytes + pckBytes;
	function mb(bytes) {
		return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
	}

	// ---------------------------------------------------------- saved data --
	// The pack is the whole download, and it is the file that changes with
	// every build. Keeping the last one in Cache Storage means the phone pays
	// for it once: the next start reads it off disk and only asks the server
	// whether it is still current (a 304 that carries no body). A new build
	// answers 200 instead, and that response *is* the new pack, so it is used
	// and stored without a second download.
	const PACK_PATH = GODOT_CONFIG['mainPack']
		|| (GODOT_CONFIG['executable'] || 'index') + '.pck';
	const PACK_URL = new URL(PACK_PATH, document.baseURI).href;
	const PACK_CACHE = 'onav-pack-v1';

	async function openPackCache() {
		if (!('caches' in window)) {
			return null;
		}
		try {
			return await caches.open(PACK_CACHE);
		} catch (e) {
			return null;
		}
	}

	function drawProgress() {
		loadedBytes = pckLoaded + wasmLoaded;
		if (loadedBytes > 0 && totalBytes > 0) {
			statusProgress.value = loadedBytes;
			statusProgress.max = totalBytes;
		} else {
			statusProgress.removeAttribute('value');
			statusProgress.removeAttribute('max');
		}
	}

	// Reads a pack response with progress, then keeps a copy on the device.
	async function readPack(resp, cache) {
		const total = Number(resp.headers.get('content-length')) || 0;
		let buf;
		if (resp.body && resp.body.getReader) {
			const reader = resp.body.getReader();
			const chunks = [];
			let size = 0;
			pckLoaded = 0;
			for (;;) {
				const step = await reader.read();
				if (step.done) {
					break;
				}
				chunks.push(step.value);
				size += step.value.length;
				pckLoaded = size;
				drawProgress();
			}
			const bytes = new Uint8Array(size);
			let at = 0;
			for (const chunk of chunks) {
				bytes.set(chunk, at);
				at += chunk.length;
			}
			buf = bytes.buffer;
		} else {
			buf = await resp.arrayBuffer();
			pckLoaded = buf.byteLength;
			drawProgress();
		}
		if (cache) {
			const tag = resp.headers.get('etag') || '';
			const modified = resp.headers.get('last-modified') || '';
			cache.put(PACK_URL, new Response(buf, {
				headers: {
					'content-type': 'application/octet-stream',
					'x-onav-tag': tag,
					'x-onav-lm': modified,
					'x-onav-size': String(buf.byteLength || total),
				},
			})).catch(() => {});
		}
		return buf;
	}

	// The pack, from this device if it is still current, from the network if not.
	async function loadPack() {
		const cache = await openPackCache();
		const hit = cache ? await cache.match(PACK_URL).catch(() => null) : null;
		if (hit) {
			const tag = hit.headers.get('x-onav-tag') || '';
			const modified = hit.headers.get('x-onav-lm') || '';
			if (tag || modified) {
				const headers = {};
				if (tag) {
					headers['If-None-Match'] = tag;
				}
				if (modified) {
					headers['If-Modified-Since'] = modified;
				}
				try {
					setStatusLine('Checking the game data on this device…');
					const probe = await fetch(PACK_URL, { headers: headers, cache: 'no-store' });
					if (probe.status === 304) {
						packFromDisk = true;
						pckLoaded = Number(hit.headers.get('x-onav-size')) || 0;
						drawProgress();
						setStatusLine('Game data is on this device — no download needed.');
						return await hit.arrayBuffer();
					}
					if (probe.ok) {
						phase = 'Downloading the new build';
						setStatusLine('New build — downloading the game data…');
						return await readPack(probe, cache);
					}
					if (probe.body) {
						try { probe.body.cancel(); } catch (e) {}
					}
				} catch (e) {
					// offline: the copy on this device is all there is
					packFromDisk = true;
					pckLoaded = Number(hit.headers.get('x-onav-size')) || 0;
					drawProgress();
					return await hit.arrayBuffer();
				}
			}
		}
		phase = 'Downloading the game data';
		setStatusLine('Downloading the game data…');
		const resp = await fetch(PACK_URL);
		if (!resp.ok) {
			throw new Error('Could not download the game data (' + resp.status + ').');
		}
		return await readPack(resp, cache);
	}

	// Does this device already hold the current pack? Used only for the ready
	// line, so it asks with HEAD: a stale copy must never cost a download here,
	// and the real load checks again before it uses what is on disk.
	async function packOnDevice() {
		const cache = await openPackCache();
		if (!cache) {
			return false;
		}
		const hit = await cache.match(PACK_URL).catch(() => null);
		if (!hit) {
			return false;
		}
		const tag = hit.headers.get('x-onav-tag') || '';
		if (!tag) {
			return false;
		}
		try {
			const head = await fetch(PACK_URL, { method: 'HEAD', cache: 'no-store' });
			return head.ok && (head.headers.get('etag') || '') === tag;
		} catch (e) {
			return true;
		}
	}

	// iOS and Android only let a page create a running AudioContext, and only
	// start an AudioWorklet, once a real gesture has happened. Godot's stock
	// shell boots the engine with no gesture at all, which is where a phone
	// sticks on the loading screen. So: wait for the tap, unlock audio inside
	// that gesture, and only then start the engine.
	function unlockAudio() {
		try {
			const Ctx = window.AudioContext || window.webkitAudioContext;
			if (!Ctx) {
				return;
			}
			const ctx = new Ctx();
			const resume = ctx.state === 'running' ? Promise.resolve() : ctx.resume();
			Promise.resolve(resume).catch(() => {}).then(() => {
				try {
					const buf = ctx.createBuffer(1, 1, 22050);
					const src = ctx.createBufferSource();
					src.buffer = buf;
					src.connect(ctx.destination);
					src.start(0);
				} catch (e) {
					// A silent blip is only here to open the audio session.
				}
				setTimeout(() => { try { ctx.close(); } catch (e) {} }, 250);
			});
		} catch (e) {
			// No audio support: the game still runs, just silent.
		}
	}

	function startNow() {
		if (started) {
			return;
		}
		started = true;
		startedAt = Date.now();

		const missing = Engine.getMissingFeatures({
			threads: GODOT_THREADS_ENABLED,
		});

		if (missing.length !== 0) {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
			return;
		}

		unlockAudio();
		setStatusMode('progress');
		setStatusLine('Starting engine…');
		setInterval(() => {
			if (!started) {
				return;
			}
			const secs = Math.round((Date.now() - startedAt) / 1000);
			if (!initializing) {
				return;
			}
			if (loadedBytes > 0) {
				setStatusLine(loadedBytes >= totalBytes
					? 'Loaded ' + mb(loadedBytes) + ' — building the night (' + secs + 's)'
					: 'Loading ' + mb(loadedBytes) + ' of ' + mb(totalBytes) + ' (' + secs + 's)');
			} else {
				setStatusLine(phase + ' (' + secs + 's)');
			}
		}, 1000);

		// The pack arrives as bytes rather than as a URL, so the engine cannot
		// be asked to download it: hand it the data and start by hand. That is
		// the only reason this does not just call `engine.startGame()`.
		loadPack().then(function (pack) {
			engine.config.args = ['--main-pack', PACK_PATH];
			engine.config.onProgress = function (current) {
				wasmLoaded = current;
				drawProgress();
			};
			return engine.preloadFile(pack, PACK_PATH)
				.then(() => engine.init(GODOT_CONFIG['executable']))
				.then(() => engine.start());
		}).then(() => {
			setStatusMode('hidden');
			console.log('[onav] started from ' + (packFromDisk ? 'this device' : 'the network'));
		}, displayFailureNotice);
	}

	// If the engine fails while starting (wasm setup, audio, WebGL), say so
	// on the page instead of leaving the loading bar sitting at 100%.
	window.addEventListener('unhandledrejection', function (e) {
		console.error(e.reason);
		displayFailureNotice(e.reason || 'The engine failed to start.');
	});

	setStatusMode('ready');
	statusHint.textContent = totalBytes > 0
		? mb(totalBytes) + ' — keep this tab open while it loads.'
		: 'Keep this tab open while it loads.';
	packOnDevice().then((saved) => {
		if (saved && statusMode === 'ready') {
			statusHint.textContent = 'Game data is saved on this device — it starts without downloading.';
		}
	});

	statusStart.addEventListener('click', startNow);
	statusStart.addEventListener('touchend', function (e) {
		e.preventDefault();
		startNow();
	});
	statusOverlay.addEventListener('keydown', function (e) {
		if (e.key === 'Enter' || e.key === ' ') {
			e.preventDefault();
			startNow();
		}
	});
}());
		</script>
	</body>
</html>
